name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_UBUNTU_BASE: dailyboy-ci:ubuntu24-base
  CI_IMAGE_UBUNTU_CY2026: dailyboy-ci:ubuntu24-cy2026

jobs:
  image-ubuntu24-base:
    name: image-ubuntu24-base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Ubuntu base image
        uses: docker/build-push-action@v6
        with:
          context: docker/ubuntu
          file: docker/ubuntu/Dockerfile.ubuntu24.base
          load: true
          tags: ${{ env.CI_IMAGE_UBUNTU_BASE }}
          cache-from: type=gha,scope=dailyboy-ci-ubuntu24-base
          cache-to: type=gha,mode=max,scope=dailyboy-ci-ubuntu24-base
      - name: Export Ubuntu base image
        run: docker save ${{ env.CI_IMAGE_UBUNTU_BASE }} -o /tmp/dailyboy-ci-ubuntu24-base.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-base-nightly
          path: /tmp/dailyboy-ci-ubuntu24-base.tar
          retention-days: 1

  image-ubuntu24-cy2026:
    name: image-ubuntu24-cy2026
    needs: image-ubuntu24-base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-base-nightly
          path: /tmp
      - name: Load Ubuntu base image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-base.tar
      # Plain docker build: buildx container driver cannot see locally loaded
      # dailyboy-ci:ubuntu24-base and would try to pull it from Docker Hub.
      - name: Build Ubuntu CY2026 image
        run: docker build -t ${{ env.CI_IMAGE_UBUNTU_CY2026 }} -f docker/ubuntu/Dockerfile.ubuntu24.cy2026 docker/ubuntu
      - name: Export Ubuntu CY2026 image
        run: docker save ${{ env.CI_IMAGE_UBUNTU_CY2026 }} -o /tmp/dailyboy-ci-ubuntu24-cy2026.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2026-nightly
          path: /tmp/dailyboy-ci-ubuntu24-cy2026.tar
          retention-days: 1

  test:
    name: run tests (Ubuntu CY2026)
    needs: image-ubuntu24-cy2026
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2026-nightly
          path: /tmp
      - name: Load Ubuntu CY2026 image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-cy2026.tar
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu24-cy2026-nightly-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24-cy2026-nightly-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-
            ccache-ubuntu24-cy2026-debug-
            ccache-cy2026-debug-
      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/docker/ubuntu24/CY2026/debug/_deps
          key: deps-ubuntu24-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**') }}
          restore-keys: |
            deps-ubuntu24-cy2026-debug-
            deps-cy2026-debug-
      - name: Build debug CY2026
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/docker.sh ./ci/build.sh 2026 debug
      - name: Run tests CY2026
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/docker.sh ./ci/test.sh 2026 tests
      - name: Coverage reports
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/docker.sh ./ci/coverage_upload.sh 2026
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-nightly
          path: build/docker/ubuntu24/CY2026/debug/coverage/
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/docker/ubuntu24/CY2026/debug/coverage/coverage.info,build/docker/ubuntu24/CY2026/debug/coverage/coverage.xml
          flags: nightly-cy2026
          name: nightly-debug-cy2026
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sanitize:
    name: sanitize-ubuntu24-cy2026
    needs: image-ubuntu24-cy2026
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2026-nightly
          path: /tmp
      - name: Load Ubuntu CY2026 image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-cy2026.tar
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu24-cy2026-sanitize-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24-cy2026-sanitize-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-
            ccache-ubuntu24-cy2026-sanitize-
            ccache-cy2026-sanitize-
      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/docker/ubuntu24/CY2026/sanitize/_deps
          key: deps-ubuntu24-cy2026-sanitize-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**') }}
          restore-keys: |
            deps-ubuntu24-cy2026-sanitize-
            deps-cy2026-sanitize-
      - name: Build sanitize CY2026
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/docker.sh ./ci/build.sh 2026 sanitize
      - name: Run sanitize tests
        run: |
          DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/docker.sh \
            -e ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 \
            -e UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            -- ./ci/test.sh 2026 sanitize

  tidy:
    name: tidy-ubuntu24-cy2026
    needs: image-ubuntu24-cy2026
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2026-nightly
          path: /tmp
      - name: Load Ubuntu CY2026 image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-cy2026.tar
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu24-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-
            ccache-ubuntu24-cy2026-debug-
            ccache-cy2026-debug-
      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/docker/ubuntu24/CY2026/debug/_deps
          key: deps-ubuntu24-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**') }}
          restore-keys: |
            deps-ubuntu24-cy2026-debug-
            deps-cy2026-debug-
      - name: Build debug CY2026
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/docker.sh ./ci/build.sh 2026 debug
      - name: Clang-tidy
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/docker.sh ./ci/tidy.sh
