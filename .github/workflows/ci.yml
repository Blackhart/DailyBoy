            ccache-ubuntu24-cy2025-debug-
            ccache-cy2025-debug-
      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/docker/ubuntu24/CY2025/debug/_deps
          key: deps-ubuntu24-cy2025-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**') }}
          restore-keys: |
            deps-ubuntu24-cy2025-debug-
            deps-cy2025-debug-
      - name: Build debug CY2025
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2025 }} ./ci/linux/docker.sh ./ci/linux/build.sh 2025 debug
      - name: Run tests CY2025
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2025 }} ./ci/linux/docker.sh ./ci/linux/test.sh 2025 tests

  tests-ubuntu24-cy2024:
    name: run tests (Ubuntu CY2024)
