name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_UBUNTU_BASE: dailyboy-ci:ubuntu24-base
  CI_IMAGE_UBUNTU_CY2026: dailyboy-ci:ubuntu24-cy2026
  CI_IMAGE_UBUNTU_CY2025: dailyboy-ci:ubuntu24-cy2025
  CI_IMAGE_UBUNTU_CY2024: dailyboy-ci:ubuntu24-cy2024
  CI_IMAGE_ROCKY_BASE: dailyboy-ci:rocky9-base
  CI_IMAGE_ROCKY_CY2026: dailyboy-ci:rocky9-cy2026
  CI_IMAGE_ROCKY_CY2025: dailyboy-ci:rocky9-cy2025
  CI_IMAGE_ROCKY_CY2024: dailyboy-ci:rocky9-cy2024

jobs:
  image-ubuntu24-base:
    name: image-ubuntu24-base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Ubuntu base image
        uses: docker/build-push-action@v6
        with:
          context: docker/ubuntu
          file: docker/ubuntu/Dockerfile.ubuntu24.base
          load: true
          tags: ${{ env.CI_IMAGE_UBUNTU_BASE }}
          cache-from: type=gha,scope=dailyboy-ci-ubuntu24-base
          cache-to: type=gha,mode=max,scope=dailyboy-ci-ubuntu24-base
      - name: Export Ubuntu base image
        run: docker save ${{ env.CI_IMAGE_UBUNTU_BASE }} -o /tmp/dailyboy-ci-ubuntu24-base.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-base
          path: /tmp/dailyboy-ci-ubuntu24-base.tar
          retention-days: 1

  image-ubuntu24-cy2026:
    name: image-ubuntu24-cy2026
    needs: image-ubuntu24-base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-base
          path: /tmp
      - name: Load Ubuntu base image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-base.tar
      - name: Build Ubuntu CY2026 image
        run: docker build -t ${{ env.CI_IMAGE_UBUNTU_CY2026 }} -f docker/ubuntu/Dockerfile.ubuntu24.cy2026 docker/ubuntu
      - name: Export Ubuntu CY2026 image
        run: docker save ${{ env.CI_IMAGE_UBUNTU_CY2026 }} -o /tmp/dailyboy-ci-ubuntu24-cy2026.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2026
          path: /tmp/dailyboy-ci-ubuntu24-cy2026.tar
          retention-days: 1

  image-ubuntu24-cy2025:
    name: image-ubuntu24-cy2025
    needs: image-ubuntu24-base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-base
          path: /tmp
      - name: Load Ubuntu base image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-base.tar
      - name: Build Ubuntu CY2025 image
        run: docker build -t ${{ env.CI_IMAGE_UBUNTU_CY2025 }} -f docker/ubuntu/Dockerfile.ubuntu24.cy2025 docker/ubuntu
      - name: Export Ubuntu CY2025 image
        run: docker save ${{ env.CI_IMAGE_UBUNTU_CY2025 }} -o /tmp/dailyboy-ci-ubuntu24-cy2025.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2025
          path: /tmp/dailyboy-ci-ubuntu24-cy2025.tar
          retention-days: 1

  image-ubuntu24-cy2024:
    name: image-ubuntu24-cy2024
    needs: image-ubuntu24-base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-base
          path: /tmp
      - name: Load Ubuntu base image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-base.tar
      - name: Build Ubuntu CY2024 image
        run: docker build -t ${{ env.CI_IMAGE_UBUNTU_CY2024 }} -f docker/ubuntu/Dockerfile.ubuntu24.cy2024 docker/ubuntu
      - name: Export Ubuntu CY2024 image
        run: docker save ${{ env.CI_IMAGE_UBUNTU_CY2024 }} -o /tmp/dailyboy-ci-ubuntu24-cy2024.tar
      - uses: actions/upload-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2024
          path: /tmp/dailyboy-ci-ubuntu24-cy2024.tar
          retention-days: 1

  format:
    name: format
    needs: image-ubuntu24-cy2026
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2026
          path: /tmp
      - name: Load Ubuntu CY2026 image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-cy2026.tar
      - name: Format check
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/linux/docker.sh ./ci/linux/format.sh

  tests-ubuntu24-cy2026:
    name: run tests (Ubuntu CY2026)
    needs: image-ubuntu24-cy2026
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-ubuntu24-cy2026
          path: /tmp
      - name: Load Ubuntu CY2026 image
        run: docker load -i /tmp/dailyboy-ci-ubuntu24-cy2026.tar
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu24-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-
            ccache-ubuntu24-cy2026-debug-
            ccache-cy2026-debug-
      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/docker/ubuntu24/CY2026/debug/_deps
          key: deps-ubuntu24-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**') }}
          restore-keys: |
            deps-ubuntu24-cy2026-debug-
            deps-cy2026-debug-
      - name: Build debug CY2026
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/linux/docker.sh ./ci/linux/build.sh 2026 debug
      - name: Run tests CY2026
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/linux/docker.sh ./ci/linux/test.sh 2026 tests
      - name: Coverage reports
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2026 }} ./ci/linux/docker.sh ./ci/linux/coverage_upload.sh 2026
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-cy2026
          path: build/docker/ubuntu24/CY2026/debug/coverage/
          if-no-files-found: warn
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/docker/ubuntu24/CY2026/debug/coverage/coverage.info,build/docker/ubuntu24/CY2026/debug/coverage/coverage.xml
          flags: unittests-cy2026
          name: debug-cy2026
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  tests-ubuntu24-cy2025:
    name: run tests (Ubuntu CY2025)
