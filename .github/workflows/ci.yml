  tests-macos-cy2026:
    name: run tests (macOS CY2026)
    runs-on: macos-14
    timeout-minutes: 360
    env:
      DAILYBOY_BUILD_ROOT: macos/
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install cmake ninja ccache pkg-config autoconf automake libtool \
            nasm freetype openssl@3 python@3.13
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
