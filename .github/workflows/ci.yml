      - name: Build debug CY2025
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2025 }} ./ci/linux/docker.sh ./ci/linux/build.sh 2025 debug
      - name: Run tests CY2025
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2025 }} ./ci/linux/docker.sh ./ci/linux/test.sh 2025 tests

