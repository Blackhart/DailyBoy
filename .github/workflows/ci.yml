    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DAILYBOY_BUILD_ROOT: docker/rocky9/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dailyboy-ci-rocky9-cy2026
          path: /tmp
      - name: Load Rocky CY2026 image
        run: docker load -i /tmp/dailyboy-ci-rocky9-cy2026.tar
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-rocky9-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-rocky9-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-
