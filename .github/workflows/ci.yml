      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/docker/rocky9/CY2026/debug/_deps
          key: deps-rocky9-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**') }}
          restore-keys: |
            deps-rocky9-cy2026-debug-
      - name: Build debug CY2026
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_ROCKY_CY2026 }} ./ci/linux/docker.sh ./ci/linux/build.sh 2026 debug
      - name: Run tests CY2026
