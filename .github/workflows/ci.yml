      - name: Build debug CY2024
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2024 }} ./ci/linux/docker.sh ./ci/linux/build.sh 2024 debug
      - name: Run tests CY2024
        run: DAILYBOY_CI_IMAGE=${{ env.CI_IMAGE_UBUNTU_CY2024 }} ./ci/linux/docker.sh ./ci/linux/test.sh 2024 tests

