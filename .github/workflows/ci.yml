  tests-macos-cy2026:
    name: run tests (macOS CY2026)
    runs-on: macos-14
    timeout-minutes: 360
    env:
      DAILYBOY_BUILD_ROOT: macos/
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew dependencies
        run: |
          brew update
