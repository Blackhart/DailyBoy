  tests-windows-cy2026:
    name: run tests (Windows CY2026)
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      DAILYBOY_BUILD_ROOT: windows/
    steps:
      - uses: actions/checkout@v4
      # VFX CY2026: VS 2022 ≥ 17.6, Windows SDK ≥ 10.0.22621 (windows-2022 image).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-tools
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-x265
      - name: Export MSYS2 bash path
        shell: pwsh
        run: |
          $bash = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "usr\bin\bash.exe"
          echo "MSYS2_BASH=$bash" >> $env:GITHUB_ENV
          # gendef from mingw tools for MSVC import libs
          echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CMake, Ninja, FreeType, OpenSSL
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install freetype:x64-windows openssl:x64-windows
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**', 'CMakePresets.json') }}-
            ccache-windows-cy2026-debug-
      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/windows/CY2026/debug/_deps
          key: deps-windows-cy2026-debug-${{ hashFiles('cmake/Versions.cmake', 'cmake/versions/**', 'cmake/deps/**') }}
          restore-keys: |
            deps-windows-cy2026-debug-
      - name: Build debug CY2026
        shell: pwsh
        run: ./ci/windows/build.ps1 2026 debug
      - name: Run tests CY2026
        shell: pwsh
        run: ./ci/windows/test.ps1 2026 tests

