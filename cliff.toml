# git-cliff configuration for DailyBoy
# https://git-cliff.org/docs/configuration

[changelog]
header = """# Changelog

All notable changes to DailyBoy are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
# Only user-facing changes belong in the public changelog (feats, product fixes,
# perf, security). CI/tidy/docs/chore noise is skipped; breaking refactors still
# surface via protect_breaking_commits.
commit_parsers = [
  { message = "^fix\\(ci\\)", skip = true },
  { message = "^fix\\(build\\)", skip = true },
  { message = "^fix\\(tidy\\)", skip = true },
  { message = "^fix:.*(?i)(clang-tidy|tidy findings|lint)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", skip = true },
  { message = "^build", skip = true },
  { message = "^docs", skip = true },
  { message = "^doc", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore", skip = true },
  { body = "(?i)security", group = "Security" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "1.0.0"
