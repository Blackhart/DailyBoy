[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyboy"
version = "1.0.0"
description = "DailyBoy Python API (VFX dailies)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
makeDaily = "dailyboy.cli:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["dailyboy*"]
